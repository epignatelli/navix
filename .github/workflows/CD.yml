name: CD

on:
  workflow_dispatch:
  schedule:
    # weekly, Monday 05:00 UTC - batches every commit merged to main
    # since the last release into one version bump/changelog/PyPI
    # publish, instead of releasing on every single push (previously
    # `on: push: branches: [main]` here) - conventional-changelog-action
    # already aggregates all commits since the last tag, so batching
    # needs no changes beyond the trigger and skip-on-empty below.
    # workflow_dispatch above still allows an out-of-cycle release
    # (e.g. an urgent fix) without waiting for the next Monday.
    - cron: "0 5 * * 1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Get current version from file
        id: current
        run: |
          NAVIX_VERSION="$(cat navix/_version.py | grep '__version__ = ' |  cut -d'=' -f2 | sed 's,\",,g' | sed "s,\',,g" | sed 's, ,,g')"
          echo "Current version is:"
          echo "$NAVIX_VERSION"

          echo "NAVIX_VERSION=$NAVIX_VERSION" >> $GITHUB_ENV

      - name: Compute next version and changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: false
          skip-commit: true
          skip-tag: true
          # a scheduled run with nothing new to release (a quiet week)
          # must be a no-op, not an empty release - true (was false)
          # only matters now that the trigger is time-based rather than
          # one release attempt per push.
          skip-on-empty: true
          tag-prefix: ""
          fallback-version: ${{ env.NAVIX_VERSION }}

      - name: Write bumped version to navix/_version.py
        if: steps.changelog.outputs.skipped != 'true'
        run: |
          sed -i "s/^__version__ = \".*\"/__version__ = \"${{ steps.changelog.outputs.version }}\"/" navix/_version.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add navix/_version.py
          git commit -m "build(release): bump version to ${{ steps.changelog.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Create Release
        if: steps.changelog.outputs.skipped != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.changelog.outputs.version }}
          name: "NAVIX release v${{ steps.changelog.outputs.version }}"
          body: ${{ steps.changelog.outputs.clean_changelog }}

      - uses: actions/setup-python@v5
        if: steps.changelog.outputs.skipped != 'true'
        with:
          python-version: "3.13"

      - name: Install pypa/build
        if: steps.changelog.outputs.skipped != 'true'
        run: |
          python -m pip install build

      - name: Build wheel and sdist
        if: steps.changelog.outputs.skipped != 'true'
        run: |
          python -m build --sdist --wheel --outdir dist/ .

      - name: Publish distribution 📦 to PyPI
        if: steps.changelog.outputs.skipped != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
