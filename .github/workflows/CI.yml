name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Test:
    runs-on: ${{ matrix.os }}-latest
    environment: ci-approval
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: ["ubuntu"]
        python-version: ["3.12", "3.13", "3.14"]
    continue-on-error: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            pyproject.toml
      - name: Setup navix
        run: |
          uv pip install --system . -v
          uv pip install --system -r requirements_test.txt
      - name: Check code quality
        if: matrix.python-version == '3.13'
        run: |
          uv pip install --system pylint
          MESSAGE=$(pylint -ry $(git ls-files '*.py') ||:)
          echo "$MESSAGE"
          {
            echo "## Pylint report (full codebase)"
            echo '```'
            echo "$MESSAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run unit tests with pytest
        run: |
          wandb offline
          pytest
      - name: Run examples
        run: |
          # Smoke-test only: confirm the scripts run end-to-end. A full
          # training budget is unnecessary here and expensive on the
          # GPU-less CI runners (default budget is 1M frames, and
          # hparam_search multiplies that by population_size).
          python examples/ppo.py --ppo-config.budget 5000
          python examples/hparam_search.py --population-size 2 --ppo-config.budget 5000

  Compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: PEP8 Compliance
        run: |
          uv pip install --system pylint
          PR_BRANCH=${{ github.event.pull_request.target.ref }}
          MAIN_BRANCH=origin/${{ github.event.pull_request.base.ref }}
          CURRENT_DIFF=$(git diff --name-only --diff-filter=d $MAIN_BRANCH $PR_BRANCH  | grep -E '\.py$' | tr '\n' ' ')
          if [[ $CURRENT_DIFF == "" ]];
            then MESSAGE="Diff is empty and there is nothing to pylint."
          else
            MESSAGE=$(pylint -ry --disable=E0401 $CURRENT_DIFF ||:)
          fi
          echo "$MESSAGE"
          {
            echo "## Pylint report (changed files)"
            echo '```'
            echo "$MESSAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
