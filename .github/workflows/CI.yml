name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Test:
    runs-on: ubuntu-latest
    environment: ci-approval
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # only the latest Python version - was ["3.13", "3.14"], trimmed
        # to just 3.14 (no more os/python-version axes now that each is
        # a single value; group is the only real matrix dimension left).
        # pytest-split divides the suite into 4 duration-balanced groups
        # (from the committed .test_durations file) - each group runs as
        # its own separate job, on its own fresh VM, so memory used by
        # one group's jax/XLA-compiled test artifacts never accumulates
        # into another's the way it did within one long-lived pytest
        # process (see the OOM this was introduced to fix). -n auto
        # inside each group adds a second, within-job axis of
        # parallelism on top (xdist), independent of this job-level
        # split - the two compose rather than replace each other.
        group: [1, 2, 3, 4]
    continue-on-error: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            pyproject.toml
      - name: Setup navix
        run: |
          uv pip install --system . -v
          uv pip install --system -r requirements_test.txt
      - name: Run unit tests with pytest
        run: |
          wandb offline
          pytest -n auto --splits 4 --group ${{ matrix.group }}
      - name: Run examples
        if: matrix.group == 1
        run: |
          for example in examples/*.py; do
            python $example
          done

  Compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v3
      - name: PEP8 Compliance
        run: |
          uv pip install --system pylint
          PR_BRANCH=${{ github.event.pull_request.target.ref }}
          MAIN_BRANCH=origin/${{ github.event.pull_request.base.ref }}
          CURRENT_DIFF=$(git diff --name-only --diff-filter=d $MAIN_BRANCH $PR_BRANCH  | grep -E '\.py$' | tr '\n' ' ')
          if [[ $CURRENT_DIFF == "" ]];
            then MESSAGE="Diff is empty and there is nothing to pylint."
          else
            MESSAGE=$(pylint -ry --disable=E0401 $CURRENT_DIFF ||:)
          fi
          echo "$MESSAGE"
          {
            echo "## Pylint report (changed files)"
            echo '```'
            echo "$MESSAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
